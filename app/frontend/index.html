<!DOCTYPE html>
<html>
<head>
    <title>ALTA Frontend</title>
</head>
<body>

    <h1>ALTA Frontend</h1>

    <div id="auth-page">
        <h2>Register</h2>

        <input id="register-name" placeholder="Name">
        <input id="register-job" placeholder="Occupation">
        <input id="register-email" placeholder="Email">
        <input id="register-password" placeholder="Password">


        <button onclick="register()" style="background-color: brown;">Register</button>

        <h2>Login</h2>

        <input id="login-email" placeholder="Email">
        <input id="login-password" placeholder="Password">

        <button onclick="login()" style="background-color: brown;">Login</button> 

    </div>

    <div id="app-page" style="display: none;">
        
        <h2>Profile</h2>
        <button onclick="logout()" style="background-color: brown;">Logout</button>

        <button onclick="getMe()" style="background-color: brown;">Get My Profile</button>

        <pre id="output"></pre>

        <h2>Personal Items :</h2>

        <ul id="item_list"></ul>

        <input id="item-input" placeholder="Add Item"> <button onclick="createItem()" style="background-color: brown;">Add</button>
        <p></p>
        <input id="Del-input" placeholder="ID required"> <button onclick="DelItem()" style="background-color: brown;">Remove</button>

    </div>

<script>


const token = localStorage.getItem("token")

// Auto-login
if (token) {
    showApp()
    getItems()
}
else {showAuth()}

async function register() {

    const response = await fetch("http://127.0.0.1:8000/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: document.getElementById("register-name").value,
            job : document.getElementById("register-job").value,
            email: document.getElementById("register-email").value,
            password: document.getElementById("register-password").value
        })
    })

    showApp()
    const data = await response.json()

    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2)
}

async function login() {

    email= document.getElementById("login-email").value
    password= document.getElementById("login-password").value
    
    if (!email || !password) {
        alert("Please fill all fields")
        return
    }

    const response = await fetch("http://127.0.0.1:8000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email,
            password: password
        })
    })

    if (!response.ok) {
        error = await response.json()
        alert(error.detail)
        return
    }

    const data = await response.json()

    localStorage.setItem("token", data.access_token)
    showApp()
    getItems()


    console.log(data)
    console.log("token is : " + token)

    document.getElementById("output").innerText = JSON.stringify(data, null, 2)
}

async function getMe() {

    const token = localStorage.getItem("token")

    const response = await fetch("http://127.0.0.1:8000/me", {

        headers: {
            "authentication": `Bearer ${token}`
        }
    })

    const data = await response.json()

    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2)
}

async function logout() {
    localStorage.removeItem("token")
    showAuth()
}

function renderItems(items){
    const list = document.getElementById("item_list")
    list.innerHTML= ""

    for (item of items){
        li = document.createElement("li")

        li.innerHTML = `${item.title} : ${item.id}`

        list.append(li)
    }
}

async function getItems() {

    const token = localStorage.getItem("token")
    
    const response = await fetch("http://127.0.0.1:8000/items",
        {
            headers : {
                "authentication": `Bearer ${token}`
            }
        }
    )

    if (!response.ok) {
        error = await response.json()
        alert(error.detail)
        return
    }

    const items = await response.json()

    renderItems(items)
}

async function createItem() {
    const token = localStorage.getItem("token")
    const item =  document.getElementById("item-input").value

    const response = await fetch("http://127.0.0.1:8000/items",
        {
            method : "POST",
            headers : {
                "Content-Type" : "application/json",
                "authentication": `Bearer ${token}`
            },

            body : JSON.stringify({
                title : item
            })
        }
    )
    getItems()
}

async function DelItem() {
    const token = localStorage.getItem("token")

    const item_ID = document.getElementById("Del-input").value

    const response = await fetch(`http://127.0.0.1:8000/items?id=${item_ID}`,
        {
            method : "DELETE",
            headers : {
                "authentication": `Bearer ${token}`
            }
        }
    )

    getItems()
}

function showApp() {
    document.getElementById("auth-page").style.display = "none"
    document.getElementById("app-page").style.display = "block"
}

function showAuth(){
    document.getElementById("auth-page").style.display = "block"
    document.getElementById("app-page").style.display = "none"
}


</script>

</body>
</html>
